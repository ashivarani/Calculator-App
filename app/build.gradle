/**
 * Plugins configuration for the MyCalculator Android application
 * Includes Android application plugin and Kotlin Android plugin.
 */
//file:noinspection GrDeprecatedAPIUsage
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

/**
 * Android-specific build configuration
 * Configures compile SDK, namespace, default config, build types, and compiler options.
 */
android {
    namespace 'com.android.calculator'
    compileSdk 36

    /**
     * Default configuration for the application
     * Includes applicationId, minSdk, targetSdk, version code/name, and test runner.
     */
    defaultConfig {
        applicationId "com.android.calculator"
        minSdk 24
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /**
     * Build types configuration
     * Defines release build behavior including minification and ProGuard files.
     */
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /**
     * Java compile options
     * Sets source and target compatibility to Java 1.8.
     */
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    /**
     * Kotlin compiler options
     * Sets JVM target version to 1.8.
     */
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

/**
 * Project dependencies
 * Includes Kotlin standard library, AndroidX libraries, Material components, ConstraintLayout,
 * and testing libraries for unit and instrumented tests.
 */
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
